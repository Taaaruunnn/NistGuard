<div class="max-w-3xl mx-auto my-8 font-sans p-4">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Start NIST CSF 2.0 Assessment</h2>
  
  <form (ngSubmit)="onSubmit()">
    <!-- Organization Details Section -->
    <div class="mb-8 p-6 border border-gray-200 rounded-lg shadow-sm bg-white">
      <h3 class="text-xl font-semibold text-gray-800 mb-4">Organization Details</h3>
      
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" for="orgName">Organization Name:</label>
        <input type="text" id="orgName" name="orgName" [(ngModel)]="organizationName" required 
               class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
      </div>
      
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" for="industry">Industry:</label>
        <input type="text" id="industry" name="industry" [(ngModel)]="industry" required 
               class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
      </div>
      
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" for="scope">Assessment Scope (e.g., Cloud, Enterprise, Branch):</label>
        <input type="text" id="scope" name="scope" [(ngModel)]="scope" required 
               class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
      </div>
    </div>

    <!-- Questionnaire Section -->
    <h3 class="text-xl font-semibold text-gray-800 mb-4">Security Controls</h3>
    <div *ngFor="let control of controls" class="mb-6 p-5 bg-gray-50 border-l-4 border-blue-600 rounded shadow-sm">
      <p class="mb-2">
        <strong class="text-gray-900">[{{control.function}}] {{control.categoryId}}</strong>
      </p>
      <p class="text-gray-700 mb-4">{{control.description}}</p>
      
      <div class="flex items-center">
        <label class="mr-3 font-medium text-gray-700" [for]="'status-' + control._id">Implementation Status:</label>
        <select [id]="'status-' + control._id" [name]="'status-' + control._id" [(ngModel)]="responses[control._id]" 
                class="p-2 border border-gray-300 rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Fully Implemented">Fully Implemented</option>
          <option value="Partially Implemented">Partially Implemented</option>
          <option value="Not Implemented">Not Implemented</option>
          <option value="Not Applicable">Not Applicable</option>
        </select>
      </div>
    </div>

    <button type="submit" 
            class="px-6 py-3 bg-green-600 text-white font-semibold rounded hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors cursor-pointer">
      Calculate Risk Score
    </button>
  </form>
</div>
