<div class="max-w-4xl mx-auto my-8 p-4 font-sans" *ngIf="assessmentData">
  <h2 class="text-3xl font-bold text-gray-800 mb-2">Assessment Results for <span class="text-blue-600">{{ assessmentData.organizationName }}</span></h2>
  <p class="text-gray-600 mb-8 text-lg">
    <strong>Industry:</strong> {{ assessmentData.industry }} | <strong>Scope:</strong> {{ assessmentData.scope }}
  </p>
  
  <!-- Overall Score Highlight -->
  <div class="p-8 bg-gray-50 border border-gray-200 rounded-lg mb-8 text-center shadow-sm">
    <h1 class="text-6xl font-black text-green-600 m-0">
      {{ assessmentData.scores.overallScore || 0 }}%
    </h1>
    <p class="text-xl text-gray-700 mt-2 font-medium">Overall Framework Security Score</p>
  </div>

  <!-- Function Scores Chart -->
  <div class="mb-8 border border-gray-200 p-6 rounded-lg bg-white shadow-sm">
    <h3 class="text-xl font-semibold text-gray-800 mb-4">Function Breakdown</h3>
    <canvas baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>

  <!-- Navigation -->
  <div class="text-center">
    <a routerLink="/" 
       class="inline-block px-6 py-3 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition-colors shadow-sm cursor-pointer">
      Start New Assessment
    </a>
  </div>
</div>

<!-- Loading State (Now with a spinning animation) -->
<div *ngIf="!assessmentData" class="flex flex-col justify-center items-center h-64 mt-12">
  <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
  <h2 class="text-xl text-gray-600 font-medium">Loading Assessment Data...</h2>
</div>
